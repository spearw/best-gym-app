name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gymtrainer
          POSTGRES_USER: gymtrainer
          POSTGRES_PASSWORD: gymtrainer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymtrainer"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://gymtrainer:gymtrainer@localhost:5432/gymtrainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Production settings pass deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: gymtrainer.onrender.com
          SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput
      - name: Unit tests
        run: pytest tests/unit
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: End-to-end tests
        run: pytest tests/e2e
