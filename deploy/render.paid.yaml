# Render blueprint for real use (paid plans). To switch from the free trial, copy this over
# render.yaml at the repo root; docs/OPERATIONS.md, "Moving to paid", has the steps.
# See docs/BUILD_PLAN.md, "Render deployment".
# The web service and the cron job share one env var group plus DATABASE_URL,
# so the nightly job has the same settings and database as the site.
# ALLOWED_HOSTS is optional: production settings always allow RENDER_EXTERNAL_HOSTNAME.
# Add ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS in the dashboard when a custom domain is added.

envVarGroups:
  - name: gymtrainer-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3

services:
  - type: web
    name: gymtrainer
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 3 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - fromGroup: gymtrainer-shared
      - key: DATABASE_URL
        fromDatabase:
          name: gymtrainer-db
          property: connectionString
      # Email for invites and password resets. Set these in the Render dashboard.
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Form videos: a Cloudflare R2 bucket (docs/OPERATIONS.md). Without them uploads are off.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false

  # Hourly: alerts, form-video clean-up, and each gym's 7am digest (manage.py cron).
  - type: cron
    name: gymtrainer-cron
    runtime: python
    plan: starter
    branch: main
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cron
    envVars:
      - fromGroup: gymtrainer-shared
      - key: DATABASE_URL
        fromDatabase:
          name: gymtrainer-db
          property: connectionString
      # The digest's links and sending, and video clean-up, need these too.
      - key: SITE_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false

databases:
  - name: gymtrainer-db
    databaseName: gymtrainer
    user: gymtrainer
    postgresMajorVersion: "16"
