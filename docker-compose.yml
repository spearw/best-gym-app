# Local Postgres. Start it with:  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gymtrainer
      POSTGRES_USER: gymtrainer
      POSTGRES_PASSWORD: gymtrainer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymtrainer"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
