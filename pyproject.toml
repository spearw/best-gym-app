[project]
name = "gymtrainer"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["mockup", "static", "staticfiles", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "allow_browser_errors(*texts): browser console errors containing these texts are expected (e.g. going offline on purpose)",
]
filterwarnings = ["ignore:No directory at:UserWarning"]
