# Render blueprint: the FREE-TIER TRIAL, so the client can try the UI (docs/OPERATIONS.md,
# "Free-tier trial"). Paid plans, the hourly cron job, email and form videos are in
# deploy/render.paid.yaml; copy that over this file when moving to real use.
#
# Free-tier limits: the site sleeps after 15 idle minutes (the next visit takes about a
# minute), the free database is deleted 30 days after it's created and has no backups,
# there's no pre-deploy step (migrations run at start-up) and no shell.

envVarGroups:
  - name: gymtrainer-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3

services:
  - type: web
    name: gymtrainer
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # No pre-deploy on free: migrate at start-up, and load the demo gym once (seed_demo
    # --if-empty leaves it alone after that, so the client's changes survive restarts).
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_demo --if-empty &&
      gunicorn config.wsgi:application --workers 2 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - fromGroup: gymtrainer-shared
      - key: DATABASE_URL
        fromDatabase:
          name: gymtrainer-db
          property: connectionString
      # The demo users' password. Required: set it in the dashboard, share it with the client.
      - key: DEMO_PASSWORD
        sync: false
      # Email and form videos stay off for the trial: invites are shared with "Copy link",
      # and the "Add a form video" button doesn't appear without STORAGE_* settings.

databases:
  - name: gymtrainer-db
    plan: free
    databaseName: gymtrainer
    user: gymtrainer
    postgresMajorVersion: "16"
