{% extends "accounts/_auth_card.html" %}
{% block title %}Reset password{% endblock %}
{% block card %}
<h2 style="font-size:1.1rem">Reset your password</h2>
<p class="tiny muted" style="margin:0 0 4px">We'll email you a link to choose a new one.</p>
<form method="post" novalidate>
  {% csrf_token %}
  <div class="field"><label for="id_email">Email</label><input class="input" type="email" name="email" id="id_email" autocomplete="email" required autofocus>{{ form.email.errors }}</div>
  <button class="btn btn--brand btn--block" type="submit">Send reset link</button>
</form>
<div class="auth-links"><a href="{% url 'accounts:login' %}">← Back to log in</a></div>
{% endblock %}
