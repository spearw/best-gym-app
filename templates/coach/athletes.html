{% extends "base_coach.html" %}
{% block title %}Athletes{% endblock %}
{% block topbar_actions %}
<div class="searchbox"><span class="svgi svgi--search"></span>
  <input name="q" value="{{ q }}" placeholder="Filter roster…" aria-label="Filter roster" autocomplete="off"
         hx-get="{% url 'coach:athletes' %}" hx-trigger="input changed delay:200ms" hx-target="#clientCards" hx-swap="outerHTML" hx-push-url="true"></div>
{% include "partials/invite_button.html" %}
{% endblock %}
{% block content %}
{% include "coach/_roster_cards.html" %}
<div class="card" style="padding:16px 18px;margin-top:18px;max-width:720px">
  <h2 class="h3" style="font-size:1rem;margin-bottom:10px">Pending invites</h2>
  <div id="inviteList" hx-get="{% url 'coach:invite_list' %}" hx-trigger="invitesChanged from:body" hx-target="this" hx-swap="innerHTML">
    {% include "partials/invite_list.html" %}
  </div>
</div>
{% endblock %}
