<div class="card" style="padding:18px" id="tagsCard" hx-sync="#tagsCard:queue all" hx-include="#tagsCard [name^=name_]">
  <div class="spread"><h2 class="h4" style="font-size:.95rem">Tags</h2><span class="tiny muted">up to {{ tag_max }} characters each</span></div>
  <div class="stack" style="gap:6px;margin-top:10px">
    {% for t in tags %}
      <div class="row" style="gap:6px;flex-wrap:nowrap">
        <form style="flex:1" hx-post="{% url 'coach:tag_rename' t.pk %}" hx-trigger="change" hx-swap="none" onsubmit="return false">
          <input class="input" name="name_{{ t.pk }}" value="{{ t.name }}" maxlength="{{ tag_max }}" aria-label="Tag name: {{ t.name }}">
        </form>
        <span class="tiny muted" style="white-space:nowrap;min-width:58px;text-align:right">{{ t.n }} exercise{{ t.n|pluralize }}</span>
        <button class="iconbtn" type="button" aria-label="Delete tag {{ t.name }}" hx-post="{% url 'coach:tag_delete' t.pk %}" hx-target="#tagsCard" hx-swap="outerHTML" hx-confirm="Delete the tag “{{ t.name }}”?{% if t.n %} It will be removed from {{ t.n }} exercise{{ t.n|pluralize }}; the exercises themselves stay.{% endif %}"><span class="svgi svgi--trash"></span></button>
      </div>
    {% empty %}
      <p class="tiny muted" style="margin:0">No tags yet.</p>
    {% endfor %}
  </div>
  <form class="row" style="margin-top:12px;flex-wrap:nowrap" hx-post="{% url 'coach:tag_add' %}" hx-target="#tagsCard" hx-swap="outerHTML">
    <input class="input" name="name" placeholder="New tag, e.g. upper-body" maxlength="{{ tag_max }}" aria-label="New tag name">
    <button class="btn btn--soft" type="submit">Add</button>
  </form>
  {% if errors.new %}<span class="errorlist">{{ errors.new }}</span>{% endif %}
</div>
