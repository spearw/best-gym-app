{# Undo for edits within this week (apps/programs/undo.py). Ctrl+Z / Cmd+Z presses it. #}
<button class="btn btn--ghost btn--sm tip" type="button" id="undoBtn" data-undo{% if oob %} hx-swap-oob="true"{% endif %}
        {% if undo_entry %}data-tip="Undo: {{ undo_entry.label }} (Ctrl+Z)" aria-label="Undo: {{ undo_entry.label }}"{% else %}aria-disabled="true" data-tip="Nothing to undo in this week yet"{% endif %}
        hx-post="{% url 'coach:week_undo' athlete.pk week.pk %}" hx-target="#programEditor" hx-swap="outerHTML"
        style="{% if not undo_entry %}opacity:.55{% endif %}">↶ {% if undo_entry %}Undo: {{ undo_entry.label|truncatechars:28 }}{% else %}Undo{% endif %}</button>
